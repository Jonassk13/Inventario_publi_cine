<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Plano Interactivo del Cine</title>
    <style>
        :root { --bg-color: #f4f7f6; --text-color: #333; --box-bg: #fff; --border-color: #ddd; --primary: #0d6efd; --success: #198754; --danger: #dc3545;}
        body.dark-mode { --bg-color: #121212; --text-color: #e0e0e0; --box-bg: #1e1e1e; --border-color: #444; --primary: #6ea8fe; }
        
        body.theme-jacqui { --primary: #0b5345; --danger: #6e2c00; --success: #1e8449; }
        body.theme-jacqui.dark-mode { --primary: #148f77; --danger: #873600; --success: #27ae60;}
        
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: 0.3s;}
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--box-bg); padding: 15px; border-radius: 8px; border-top: 5px solid #e83e8c; box-shadow: 0 4px 6px rgba(0,0,0,0.05);}
        .btn { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
        .btn:hover { opacity: 0.8; }
        .btn-dark { background: #212529; } .btn-warning { background: #fd7e14; } .btn-danger { background: var(--danger); } .btn-primary { background: var(--primary); }

        .layout { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap;}
        
        .mapa-wrapper { flex: 3; min-width: 600px; background: var(--box-bg); padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid var(--border-color);}
        
        .controles-mapa { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: rgba(0,0,0,0.05); padding: 10px; border-radius: 8px; border: 1px dashed var(--border-color);}
        body.dark-mode .controles-mapa { background: rgba(255,255,255,0.05); }

        /* EL MOTOR DE ZOOM (VENTANA Y LIENZO) */
        .zoom-wrapper {
            width: 100%; aspect-ratio: 1.4; border: 2px solid #555; border-radius: 5px;
            overflow: hidden; position: relative; background: #e0e0e0; cursor: grab;
        }
        .zoom-wrapper:active { cursor: grabbing; }

        .plano-container {
            width: 100%; height: 100%; background-image: url('plano_cine.jpg'); 
            background-size: contain; background-repeat: no-repeat; background-position: center; 
            transform-origin: top left; transition: transform 0.05s ease-out; position: relative;
        }

        .marcador-mini {
            position: absolute; background: var(--success); color: white;
            border-radius: 4px; font-weight: bold; display: flex; align-items: center; justify-content: center;
            border: 2px solid white; box-shadow: 0 3px 6px rgba(0,0,0,0.5); user-select: none; z-index: 10;
        }
        .marcador-mini.modo-edicion { cursor: grab; }
        .marcador-mini.modo-edicion:active { cursor: grabbing; transform: scale(1.3); z-index: 100;}
        
        .marcador-mini.vacio { background: #808080; border-color: #ccc; opacity: 0.8;}
        .marcador-mini.error { background: var(--danger); animation: parpadeoError 1s infinite alternate; z-index: 20;}
        
        @keyframes parpadeoError { from { box-shadow: 0 0 5px red;} to { box-shadow: 0 0 15px red;} }

        .panel-conflictos { flex: 1; min-width: 300px; background: var(--box-bg); padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid var(--border-color);}
        .lista-peliculas { list-style: none; padding: 0; margin: 0; max-height: 70vh; overflow-y: auto;}
        .lista-peliculas li { padding: 10px; border-bottom: 1px dashed var(--border-color); font-size: 14px; display: flex; align-items: center; gap: 10px;}
        .num-badge { background: #555; color: white; padding: 3px 7px; border-radius: 4px; font-weight: bold; font-size: 12px; min-width: 15px; text-align: center;}
        .num-badge.lleno { background: var(--success); }
        .num-badge.error { background: var(--danger); animation: parpadeoError 1s infinite alternate;}
        .conflicto-rojo { color: var(--danger); font-weight: bold; background: rgba(220, 53, 69, 0.05); border-radius: 5px; }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0; color: #e83e8c;">📍 Plano Interactivo: Próximos Estrenos</h1>
    <button class="btn btn-dark" onclick="toggleDarkMode()">🌙 / ☀️</button>
</div>

<div class="layout">
    <div class="mapa-wrapper">
        
        <!-- PANEL DE CONTROLES (EDITAR Y ZOOM) -->
        <div class="controles-mapa" id="panelControles">
            <div>
                <button id="btnModoEdicion" class="btn btn-warning" onclick="toggleModoEdicion()" style="display: none;">🔓 Editar Posiciones</button>
                <span id="controlTamaño" style="display:none; margin-left: 15px; font-weight: bold; font-size: 14px;">
                    Tamaño: <input type="range" id="sizeSlider" min="15" max="50" onchange="guardarTamaño(this.value)" oninput="actualizarTamañoEnVivo(this.value)">
                </span>
            </div>
            <div>
                <span style="font-size: 13px; color: gray; margin-right: 10px;" id="textoInstruccion">Usa la rueda del ratón para Zoom. Arrastra el fondo para moverte.</span>
                <button class="btn btn-dark" onclick="aplicarZoom(0.2)">🔍 +</button>
                <button class="btn btn-dark" onclick="aplicarZoom(-0.2)">🔎 -</button>
                <button class="btn btn-primary" onclick="resetearVista()">🔄 Centrar</button>
            </div>
        </div>
        
        <!-- LIENZO CON MOTOR DE PAN/ZOOM -->
        <div class="zoom-wrapper" id="zoomWrapper">
            <div class="plano-container" id="contenedorPlano"></div>
        </div>
    </div>

    <div class="panel-conflictos">
        <h3 style="margin-top:0; color:var(--primary);">Control de Posiciones</h3>
        <p style="font-size:12px; color:gray;">Los marcadores en rojo ⚠️ indican que ese póster también está activo en la Cartelera Principal y deberías retirarlo de aquí.</p>
        <ul class="lista-peliculas" id="listaAnalisis">
            <li>Analizando ubicaciones...</li>
        </ul>
    </div>
</div>

<script>
    const API_CARTELERAS = 'https://jonassk13.pythonanywhere.com/api/carteleras';
    const API_ESTRENOS = 'https://jonassk13.pythonanywhere.com/api/estrenos';
    const API_CONFIG_MAPA = 'https://jonassk13.pythonanywhere.com/api/config/mapa';
    const API_CONFIG_SIZE = 'https://jonassk13.pythonanywhere.com/api/config/size';
    
    let rolUsuario = localStorage.getItem('rolCine') || 'General';
    let posicionesGuardadas = {};
    let isEditing = false;
    let marcadorSize = 26;

    // Variables del Motor de Zoom y Paneo
    let currentScale = 1;
    let translateX = 0;
    let translateY = 0;
    let isDraggingMap = false;
    let startX, startY;

    window.onload = () => {
        if(localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode');
        if(rolUsuario === 'Subgerente') document.body.classList.add('theme-jacqui');
        
        if(rolUsuario === 'Admin' || rolUsuario === 'Subgerente') {
            document.getElementById('btnModoEdicion').style.display = 'inline-block';
        }
        
        inicializarPlano();
    };

    function toggleDarkMode() { document.body.classList.toggle('dark-mode'); localStorage.setItem('darkMode', document.body.classList.contains('dark-mode')); }

    async function inicializarPlano() {
        const resCartelera = await fetch(API_CARTELERAS); const dataCartelera = await resCartelera.json();
        const resEstrenos = await fetch(API_ESTRENOS); const dataEstrenos = await resEstrenos.json();
        const resPos = await fetch(API_CONFIG_MAPA); const dataPos = await resPos.json();
        const resSize = await fetch(API_CONFIG_SIZE); const dataSize = await resSize.json();

        marcadorSize = parseInt(dataSize.size) || 26;
        document.getElementById('sizeSlider').value = marcadorSize;

        try { posicionesGuardadas = JSON.parse(dataPos.posicion); if (posicionesGuardadas.top) posicionesGuardadas = {}; } catch(e) { posicionesGuardadas = {}; }
        let idsEnCartelera = dataCartelera.filter(c => c.ID_Publicidad !== null).map(c => c.ID_Publicidad);

        const container = document.getElementById('contenedorPlano');
        const listaUI = document.getElementById('listaAnalisis');
        container.innerHTML = ''; listaUI.innerHTML = '';

        dataEstrenos.slots.forEach((est, index) => {
            let tieneConflicto = est.ID_Publicidad !== null && idsEnCartelera.includes(est.ID_Publicidad);
            let estaVacio = est.ID_Publicidad === null;

            let tituloPeli = estaVacio ? `<span style="color:gray;"><em>Espacio Vacío</em></span>` : est.Nombre_Material;
            let claseBadge = estaVacio ? '' : (tieneConflicto ? 'error' : 'lleno');
            
            if (tieneConflicto) { listaUI.innerHTML += `<li class="conflicto-rojo"><span class="num-badge ${claseBadge}">${est.ID_Slot}</span> <div>⚠️ <b>${tituloPeli}</b> <br><small>Quitar: Ya está en cartelera</small></div></li>`; } 
            else { listaUI.innerHTML += `<li><span class="num-badge ${claseBadge}">${est.ID_Slot}</span> ${tituloPeli}</li>`; }

            let marker = document.createElement('div');
            marker.className = 'marcador-mini';
            if (tieneConflicto) marker.classList.add('error');
            else if (estaVacio) marker.classList.add('vacio');
            
            marker.innerText = est.ID_Slot;
            marker.title = estaVacio ? `Espacio #${est.ID_Slot} (Vacío)` : `Espacio #${est.ID_Slot}: ${est.Nombre_Material}`;

            // Aplicamos el tamaño de la base de datos
            marker.style.width = marcadorSize + 'px';
            marker.style.height = marcadorSize + 'px';
            marker.style.fontSize = (marcadorSize * 0.5) + 'px';

            let posFallbackTop = 5 + Math.floor(index / 10) * 10; 
            let posFallbackLeft = 5 + (index % 10) * 8; 
            let pos = posicionesGuardadas[est.ID_Slot] || { top: posFallbackTop + '%', left: posFallbackLeft + '%' };
            marker.style.top = pos.top; marker.style.left = pos.left;

            container.appendChild(marker);
            inicializarArrastreMarcador(marker, est.ID_Slot);
        });
    }

    // === MODO EDICIÓN Y TAMAÑOS ===
    function toggleModoEdicion() {
        isEditing = !isEditing;
        const btn = document.getElementById('btnModoEdicion');
        const slider = document.getElementById('controlTamaño');
        const txt = document.getElementById('textoInstruccion');

        if (isEditing) {
            btn.innerText = "🔒 Confirmar y Bloquear Posiciones";
            btn.className = "btn btn-danger";
            slider.style.display = 'inline';
            txt.innerText = "Arrastra los números para moverlos. Zoom desactivado.";
            resetearVista(); // Reseteamos el zoom para evitar que el mapeo % falle
            document.querySelectorAll('.marcador-mini').forEach(m => m.classList.add('modo-edicion'));
            document.getElementById('zoomWrapper').style.cursor = 'default';
        } else {
            btn.innerText = "🔓 Editar Posiciones";
            btn.className = "btn btn-warning";
            slider.style.display = 'none';
            txt.innerText = "Usa la rueda del ratón para Zoom. Arrastra el fondo para moverte.";
            document.querySelectorAll('.marcador-mini').forEach(m => m.classList.remove('modo-edicion'));
            document.getElementById('zoomWrapper').style.cursor = 'grab';
        }
    }

    function actualizarTamañoEnVivo(val) {
        document.querySelectorAll('.marcador-mini').forEach(m => {
            m.style.width = val + 'px';
            m.style.height = val + 'px';
            m.style.fontSize = (val * 0.5) + 'px';
        });
    }

    function guardarTamaño(val) {
        fetch(API_CONFIG_SIZE, { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({size: parseInt(val)}) });
    }

    // === LÓGICA DE ARRASTRE DE MARCADORES ===
    function inicializarArrastreMarcador(elemento, idSlot) {
        elemento.onmousedown = function(e) {
            if(!isEditing) return; // Si está bloqueado, ignoramos el clic para dejar que el mapa haga Zoom/Pan
            e.stopPropagation(); // Evita que se mueva el fondo al mover un número

            document.querySelectorAll('.marcador-mini').forEach(el => el.style.zIndex = 10);
            elemento.style.zIndex = 100;

            let container = document.getElementById('contenedorPlano');
            let rect = container.getBoundingClientRect();
            let shiftX = e.clientX - elemento.getBoundingClientRect().left;
            let shiftY = e.clientY - elemento.getBoundingClientRect().top;

            function moveAt(clientX, clientY) {
                let newLeft = clientX - shiftX - rect.left;
                let newTop = clientY - shiftY - rect.top;
                
                if(newLeft < 0) newLeft = 0; if(newTop < 0) newTop = 0;
                if(newLeft + elemento.offsetWidth > rect.width) newLeft = rect.width - elemento.offsetWidth;
                if(newTop + elemento.offsetHeight > rect.height) newTop = rect.height - elemento.offsetHeight;

                elemento.style.left = (newLeft / rect.width * 100) + '%';
                elemento.style.top = (newTop / rect.height * 100) + '%';
            }

            function onMouseMove(event) { moveAt(event.clientX, event.clientY); }
            function onMouseUp() {
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
                posicionesGuardadas[idSlot] = { top: elemento.style.top, left: elemento.style.left };
                fetch(API_CONFIG_MAPA, { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({posicion: JSON.stringify(posicionesGuardadas)}) });
            }

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        };
        elemento.ondragstart = function() { return false; }; 
    }

    // === MOTOR DE ZOOM Y PANEO DEL MAPA ===
    const zoomWrapper = document.getElementById('zoomWrapper');
    const planoContainer = document.getElementById('contenedorPlano');

    function actualizarTransformacion() {
        planoContainer.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;
    }

    function aplicarZoom(delta) {
        if(isEditing) return; // No permitimos zoom mientras se editan las coordenadas
        currentScale += delta;
        if(currentScale < 1) currentScale = 1; // Límite para no alejarse de más
        if(currentScale > 5) currentScale = 5; // Límite de acercamiento máximo
        actualizarTransformacion();
    }

    function resetearVista() {
        currentScale = 1; translateX = 0; translateY = 0;
        actualizarTransformacion();
    }

    // Zoom con la Rueda del Ratón
    zoomWrapper.addEventListener('wheel', (e) => {
        if(isEditing) return;
        e.preventDefault(); // Evita que la página completa haga scroll
        aplicarZoom(e.deltaY < 0 ? 0.2 : -0.2);
    });

    // Paneo (Arrastrar la Imagen de fondo)
    zoomWrapper.addEventListener('mousedown', (e) => {
        if(isEditing) return;
        isDraggingMap = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
        zoomWrapper.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', (e) => {
        if(!isDraggingMap || isEditing) return;
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        actualizarTransformacion();
    });

    window.addEventListener('mouseup', () => {
        isDraggingMap = false;
        if(!isEditing) zoomWrapper.style.cursor = 'grab';
    });
</script>
</body>
</html>
