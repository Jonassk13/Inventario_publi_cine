<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stands de Lobby</title>
    <style>
        :root { --bg-color: #f4f7f6; --text-color: #333; --box-bg: #fff; --border-color: #ddd; --primary: #fd7e14; --success: #198754; --danger: #dc3545;}
        body.dark-mode { --bg-color: #121212; --text-color: #e0e0e0; --box-bg: #1e1e1e; --border-color: #444; }
        
        body.theme-jacqui { --primary: #d35400; --danger: #6e2c00; --success: #1e8449; }
        body.theme-amanecer { background-image: linear-gradient(to bottom, rgba(168, 230, 207, 0.4), rgba(27, 94, 32, 0.9)), url('https://images.unsplash.com/photo-1425913397330-cf8af2ff40a1?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80') !important; background-attachment: fixed !important; background-size: cover !important;}
        body.theme-amanecer .box, body.theme-amanecer .modal-content { background: rgba(20, 60, 40, 0.6) !important; border-color: #a8e6cf !important; backdrop-filter: blur(8px); box-shadow: 0 10px 40px rgba(0,0,0,0.6); color: #fff !important; }
        body.theme-amanecer select, body.theme-amanecer input { background: rgba(0,0,0,0.4) !important; color: white !important; }
        
        body.theme-atardecer { background-image: linear-gradient(to bottom, rgba(255, 110, 64, 0.45), rgba(42, 8, 69, 0.95)), url('https://images.unsplash.com/photo-1511497584788-876760111969?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80') !important; background-attachment: fixed !important; background-size: cover !important;}
        body.theme-atardecer .box, body.theme-atardecer .modal-content { background: rgba(30, 10, 20, 0.6) !important; border-color: #ff7e5f !important; backdrop-filter: blur(8px); box-shadow: 0 10px 40px rgba(0,0,0,0.9); color: #ffe8d6 !important; }
        body.theme-atardecer select, body.theme-atardecer input { background: rgba(0,0,0,0.5) !important; color: white !important; }

        body.theme-noche { background-image: linear-gradient(to bottom, rgba(10, 25, 47, 0.7), rgba(2, 6, 12, 0.98)), url('https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80') !important; background-attachment: fixed !important; background-size: cover !important;}
        body.theme-noche .box, body.theme-noche .modal-content { background: rgba(10, 15, 30, 0.7) !important; border-color: #64ffda !important; backdrop-filter: blur(8px); box-shadow: 0 10px 40px rgba(0,0,0,0.9); color: #e6f1ff !important; }
        body.theme-noche select, body.theme-noche input { background: rgba(0,0,0,0.5) !important; color: #e6f1ff !important; }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: 0.3s;}
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--box-bg); padding: 15px; border-radius: 8px; border-top: 5px solid var(--primary); }
        .box { background: var(--box-bg); padding: 20px; border-radius: 10px; }
        
        .grid-stands { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .slot { border: 2px dashed #999; border-radius: 8px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; background: rgba(0,0,0,0.02); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 120px;}
        .slot.lleno { border: 2px solid var(--success); background: rgba(25, 135, 84, 0.1); border-style: solid;}
        
        .slot-numero { font-size: 11px; color: gray; margin-bottom: 5px;}
        .poster-nombre { font-size: 16px; color: var(--primary); font-weight: bold;}
        .badge-cat { font-size: 10px; background: #333; color: white; padding: 2px 5px; border-radius: 10px; margin-top: 5px;}
        
        button { border: none; cursor: pointer; border-radius: 5px; color: white; font-weight: bold; padding: 10px; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        .btn-success { background: var(--success); } .btn-danger { background: var(--danger); } .btn-dark { background: #222; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--box-bg); padding: 25px; border-radius: 10px; width: 90%; max-width: 450px; position: relative;}
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: var(--text-color); background: none; border: none; padding: 0;}
        select, input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid var(--border-color); box-sizing: border-box; }
    </style>
</head>
<body>

<div class="header">
    <div><h1 style="margin:0; color:var(--primary);">🎪 Control de Stands de Lobby</h1></div>
    <div>
        <button class="btn-dark" onclick="abrirConfig()">⚙️ Ajustar Cantidad</button>
        <button class="btn-dark" onclick="toggleDarkMode()">🌙 / ☀️</button>
    </div>
</div>

<div class="box">
    <div class="grid-stands" id="gridStands"><h3 style="grid-column:1/-1; text-align:center;">Cargando mapa de stands...</h3></div>
</div>

<div id="modalAsignar" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="cerrarModal('modalAsignar')">&times;</button>
        <h2 style="margin-top: 0; color: var(--success);">📥 Armar Stand</h2>
        <p id="textoSlot">Selecciona el promocional para ubicarlo aquí:</p>
        <select id="selectPoster" onkeydown="if(event.key==='Enter') guardarAsignacion()"></select>
        <input type="hidden" id="hiddenSlotId">
        <button class="btn-success" style="width:100%; margin-top:10px; font-size:16px;" onclick="guardarAsignacion()">Instalar</button>
    </div>
</div>

<div id="modalConfig" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="cerrarModal('modalConfig')">&times;</button>
        <h2 style="margin-top: 0;">⚙️ Configurar Lobby</h2>
        <p>¿Cuántos espacios para Stands / Lonas tienes armados físicamente?</p>
        <input type="number" id="inputTotalSlots" min="1" max="100" onkeydown="if(event.key==='Enter') guardarConfig()">
        <button class="btn-success" style="width:100%;" onclick="guardarConfig()">Guardar Tamaño</button>
    </div>
</div>

<script>
    document.addEventListener('keydown', event => { 
        if (event.key === 'Escape') { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
    });

    const API_STANDS = 'https://jonassk13.pythonanywhere.com/api/stands';
    const API_INVENTARIO = 'https://jonassk13.pythonanywhere.com/api/inventario';

    function aplicarTemasMagicos() {
        let rolUsuario = localStorage.getItem('rolCine') || '';
        let nombreUsuario = localStorage.getItem('nombreCine') || '';
        if(rolUsuario !== 'Subgerente') return; 
        if(nombreUsuario.toLowerCase().includes('jacqui') || nombreUsuario.toLowerCase().includes('jacqueline')) {
            let hora = new Date().getHours();
            if (hora >= 6 && hora < 12) { document.body.classList.add('theme-amanecer'); } 
            else if (hora >= 12 && hora < 19) { document.body.classList.add('theme-atardecer'); } 
            else { document.body.classList.add('theme-noche'); }
        } else { document.body.classList.add('theme-jacqui'); }
    }

    window.onload = () => {
        if(localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode');
        cargarDatos(); aplicarTemasMagicos();
    };

    function toggleDarkMode() { document.body.classList.toggle('dark-mode'); localStorage.setItem('darkMode', document.body.classList.contains('dark-mode')); }
    function abrirModal(id) { document.getElementById(id).style.display = 'flex'; setTimeout(()=> { let inputs = document.getElementById(id).getElementsByTagName('input'); if(inputs.length>0) inputs[0].focus(); else { let selects = document.getElementById(id).getElementsByTagName('select'); if(selects.length>0) selects[0].focus(); } }, 100); }
    function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }

    function cargarDatos() {
        fetch(API_STANDS).then(res => res.json()).then(data => {
            document.getElementById('inputTotalSlots').value = data.total;
            const grid = document.getElementById('gridStands'); grid.innerHTML = '';
            data.slots.forEach(s => {
                const estaLleno = s.ID_Publicidad !== null; const clase = estaLleno ? 'slot lleno' : 'slot';
                let catBadge = estaLleno ? `<div class="badge-cat">${s.Categoria}</div>` : '';
                const contenido = estaLleno ? `<span class="poster-nombre">${s.Nombre_Material}</span>${catBadge}<button class="btn-danger" style="margin-top:10px; font-size:12px; padding:5px 10px;" onclick="liberarSlot(event, ${s.ID_Slot})">Desarmar</button>` : `<span style="color:gray;">Lugar Disponible</span>`;
                grid.innerHTML += `<div class="${clase}" onclick="abrirAsignacion(${s.ID_Slot}, ${estaLleno})"><div class="slot-numero">Stand / Lona #${s.ID_Slot}</div>${contenido}</div>`;
            });
        });
    }

    function abrirConfig() { abrirModal('modalConfig'); }
    function guardarConfig() {
        const total = document.getElementById('inputTotalSlots').value;
        fetch(`${API_STANDS}/config`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({total}) }).then(() => { cerrarModal('modalConfig'); cargarDatos(); });
    }

    function abrirAsignacion(idSlot, estaLleno) {
        if(estaLleno) return;
        document.getElementById('hiddenSlotId').value = idSlot; document.getElementById('textoSlot').innerText = `Armando en Espacio #${idSlot}`;
        const sel = document.getElementById('selectPoster'); sel.innerHTML = '<option value="">-- Elige un Promocional en Bodega --</option>';
        fetch(API_INVENTARIO).then(res => res.json()).then(data => {
            let disponibles = data.filter(p => (p.Categoria === 'Standee / Lona' || p.Categoria === 'Palomera') && p.Cantidad_Guardados > 0); disponibles.sort((a,b) => a.Nombre_Material.localeCompare(b.Nombre_Material));
            disponibles.forEach(p => { sel.innerHTML += `<option value="${p.ID_Publicidad}">[${p.Categoria}] ${p.Nombre_Material} (Disp: ${p.Cantidad_Guardados})</option>`; });
        });
        abrirModal('modalAsignar');
    }

    function guardarAsignacion() {
        const idSlot = document.getElementById('hiddenSlotId').value; const idPub = document.getElementById('selectPoster').value;
        if(!idPub) return alert("❌ Debes seleccionar un promocional.");
        fetch(`${API_STANDS}/${idSlot}/asignar`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ id_publicidad: idPub }) }).then(res => res.json()).then(data => { if(data.error) alert("❌ " + data.error); else { cerrarModal('modalAsignar'); cargarDatos(); } });
    }

    function liberarSlot(event, idSlot) {
        event.stopPropagation();
        if(confirm("¿Seguro que deseas desarmar este promocional y enviarlo a bodega?")) { fetch(`${API_STANDS}/${idSlot}/liberar`, { method: 'POST' }).then(() => cargarDatos()); }
    }
</script>
</body>
</html>
