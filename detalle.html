<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Material</title>
    <style>
        :root { --bg-color: #e9ecef; --text-color: #333; --box-bg: #fff; --border-color: #ddd; --th-bg: #f1f1f1; --th-text: #333;}
        body.dark-mode { --bg-color: #121212; --text-color: #e0e0e0; --box-bg: #1e1e1e; --border-color: #444; --th-bg: #2c2c2c; --th-text: #e0e0e0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; box-sizing: border-box; transition: 0.3s;}

        .theme-toggle { background: #333; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; display: block; margin: 0 auto 20px auto; font-weight: bold;}
        body.dark-mode .theme-toggle { background: #f8f9fa; color: #121212; }

        .card { background: var(--box-bg); padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); max-width: 600px; margin: 0 auto; border: 1px solid var(--border-color); transition: 0.3s;}
        h1 { color: #17a2b8; margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px;}
        .badge { background: #ffc107; color: #000; font-size: 14px; padding: 5px 10px; border-radius: 15px; font-weight: bold;}

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .stat-box { background: var(--bg-color); padding: 15px; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; border: 1px solid var(--border-color); transition: 0.3s;}
        .highlight-green { color: #28a745; font-size: 24px; display: block; margin-top: 5px;}
        .highlight-red { color: #dc3545; font-size: 24px; display: block; margin-top: 5px;}

        .action-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 20px;}
        button { border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s;}
        button:hover { opacity: 0.8; }
        .btn-sacar { background: #0d6efd; }
        .btn-regresar { background: #198754; }
        .btn-daño { background: #dc3545; }
        .btn-reserva { background: #6f42c1; }

        .history-section { margin-top: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid var(--border-color); padding: 8px; text-align: left; }
        th { background: var(--th-bg); color: var(--th-text); }
        
        .oculto { display: none !important; }
    </style>
</head>
<body>

<button class="theme-toggle" onclick="toggleDarkMode()">🌙 / ☀️ Cambiar Modo</button>

<div class="card" id="tarjetaContenido">
    <h2>Cargando datos del material...</h2>
</div>

<div class="card history-section" id="seccionHistorial" style="margin-top: 20px;">
    <h3 id="zona-secreta" style="margin-top: 0; color: #6c757d; cursor: default;">📜 Historial de Movimientos</h3>
    <table>
        <thead><tr><th>Fecha</th><th>Acción</th><th>Detalle</th></tr></thead>
        <tbody id="tablaHistorial"><tr><td colspan="3">Cargando historial...</td></tr></tbody>
    </table>
</div>

<script>
    window.onload = () => { if(localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode'); };
    
    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
    }

    const urlParams = new URLSearchParams(window.location.search);
    const idProd = urlParams.get('id');
    const API_BASE = 'https://jonassk13.pythonanywhere.com/api/inventario';
    const API_RESERVAS = 'https://jonassk13.pythonanywhere.com/api/reservas';
    let prodGlobal = null;

    const rolUsuario = localStorage.getItem('rolCine') || 'General';

    if (rolUsuario === 'General') {
        document.getElementById('seccionHistorial').classList.add('oculto');
    }

    if (idProd) { 
        cargarDatos(); 
        if (rolUsuario !== 'General') {
            cargarHistorial(); 
        }
    } else { 
        document.getElementById('tarjetaContenido').innerHTML = `<h2 style="color:red;">Falta el ID del producto.</h2>`; 
    }

    function cargarDatos() {
        fetch(`${API_BASE}/${idProd}`)
        .then(res => { if(!res.ok) throw new Error(); return res.json(); })
        .then(data => {
        
            let item = Array.isArray(data) ? data[0] : data;
            
            prodGlobal = item;
            
            let botonesHTML = '';
            
            if(rolUsuario === 'Admin' || rolUsuario === 'Supervisor') {
                botonesHTML += `
                    <button class="btn-sacar" onclick="registrarMovimiento('salida')">📤 Sacar a Piso/Dulcería</button>
                    <button class="btn-regresar" onclick="registrarMovimiento('regreso')">📥 Regresar a Bodega</button>
                    <button class="btn-daño" onclick="registrarMovimiento('desecho')">🗑️ Reportar Daño / Merma</button>
                    <button class="btn-reserva" onclick="hacerReserva()">📋 Apartar / Reservar</button>
                `;

                document.getElementById('tarjetaContenido').innerHTML = `
                    <h1>${item.Nombre_Material} <span class="badge">${item.Categoria}</span></h1>
                    <div class="stats-grid">
                        <div class="stat-box">Bodega <span class="highlight-green">${item.Cantidad_Guardados}</span></div>
                        <div class="stat-box">Piso/Exhibición <span class="highlight-red">${item.Cantidad_Cartelera}</span></div>
                    </div>
                    <div class="action-grid">
                        ${botonesHTML}
                    </div>
                `;
            } else {
                botonesHTML += `<button class="btn-reserva" onclick="hacerReserva()">📋 Apartar / Reservar</button>`;

                document.getElementById('tarjetaContenido').innerHTML = `
                    <h1 style="justify-content: center; text-align: center;">${item.Nombre_Material}</h1>
                    <div class="stats-grid" style="grid-template-columns: 1fr;">
                        <div class="stat-box">Piezas disponibles en Bodega <span class="highlight-green">${item.Cantidad_Guardados}</span></div>
                    </div>
                    <div class="action-grid">
                        ${botonesHTML}
                    </div>
                `;
            }
        }).catch(() => { document.getElementById('tarjetaContenido').innerHTML = `<h2 style="color:red;">Producto no encontrado.</h2>`; });
    }

    function registrarMovimiento(tipo) {
        let cantidad = prompt("¿Cuántas piezas vas a mover?");
        if (!cantidad || isNaN(cantidad) || cantidad <= 0) return alert("Cantidad inválida.");
        cantidad = parseInt(cantidad);

        if (tipo === 'salida' && cantidad > prodGlobal.Cantidad_Guardados) return alert("No hay suficientes en bodega.");
        if (tipo === 'regreso' && cantidad > prodGlobal.Cantidad_Cartelera) return alert("No hay tantas en piso.");
        if (tipo === 'desecho' && cantidad > (prodGlobal.Cantidad_Guardados + prodGlobal.Cantidad_Cartelera)) return alert("La cantidad excede el total existente.");

        fetch(`${API_BASE}/${idProd}/movimiento`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tipo: tipo, cantidad: cantidad })
        }).then(() => { 
            cargarDatos(); 
            cargarHistorial(); 
        });
    }

    function hacerReserva() {
        let nombre = prompt("¿A nombre de quién queda el apartado?");
        if(!nombre || nombre.trim() === '') return;
        nombre = nombre.trim();

        let cantidad = prompt("¿Cuántas piezas vas a apartar?");
        if(!cantidad || isNaN(cantidad) || cantidad <= 0) return alert("Cantidad inválida.");
        cantidad = parseInt(cantidad);
        
        if(cantidad > prodGlobal.Cantidad_Guardados) return alert("No hay suficientes piezas en bodega para apartar.");

        fetch(API_RESERVAS, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id_publicidad: idProd, nombre: nombre, cantidad: cantidad })
        }).then(() => { 
            alert(`✅ ${cantidad} piezas apartadas exitosamente para ${nombre}`); 
            cargarDatos(); 
            if (rolUsuario !== 'General') cargarHistorial(); 
        });
    }

    function cargarHistorial() {
        fetch(`${API_BASE}/${idProd}/historial`)
        .then(res => res.json())
        .then(data => {
            const tb = document.getElementById('tablaHistorial');
            tb.innerHTML = '';
            if(data.length === 0) tb.innerHTML = `<tr><td colspan="3" style="text-align:center;">Sin movimientos aún</td></tr>`;
            data.forEach(h => {
                tb.innerHTML += `<tr><td>${h.Fecha_Movimiento}</td><td><strong>${h.Tipo_Movimiento}</strong></td><td>${h.Detalle}</td></tr>`;
            });
        });
    }
</script>

<style>
    #sello-sk13 { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(5); font-size: 60px; font-family: 'Arial Black', sans-serif; color: rgba(220, 53, 69, 0.85); border: 10px solid rgba(220, 53, 69, 0.85); padding: 20px 40px; border-radius: 15px; text-transform: uppercase; z-index: 99999; pointer-events: none; text-shadow: 3px 3px 6px rgba(0,0,0,0.3); box-shadow: 0 0 25px rgba(220,53,69,0.4), inset 0 0 20px rgba(220,53,69,0.4); opacity: 0; visibility: hidden; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease-in-out; }
    #sello-sk13.mostrar { visibility: visible; opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-15deg); }
</style>
<div id="sello-sk13">Creado por SK13</div>
<script>
    let contadorClics = 0; let temporizadorClics;
    document.addEventListener('click', (e) => { 
        if(e.target && e.target.id === 'zona-secreta') {
            contadorClics++; clearTimeout(temporizadorClics);
            temporizadorClics = setTimeout(() => { contadorClics = 0; }, 1500);
            if (contadorClics === 13) {
                const sello = document.getElementById('sello-sk13');
                if(!sello.classList.contains('mostrar')) { sello.classList.add('mostrar'); setTimeout(() => { sello.classList.remove('mostrar'); }, 13000); }
                contadorClics = 0;
            }
        }
    });
</script>
</body>
</html>
