<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Póster</title>
    <style>
        :root { --bg-color: #f4f7f6; --text-color: #333; --box-bg: #fff; --border-color: #ddd; --primary: #0d6efd; --success: #198754; --danger: #dc3545; --reserva: #6f42c1; }
        body.dark-mode { --bg-color: #121212; --text-color: #e0e0e0; --box-bg: #1e1e1e; --border-color: #444; --primary: #6ea8fe; --reserva: #b288e7; }
        
        body.theme-jacqui { --primary: #0b5345; --danger: #6e2c00; --success: #1e8449; --reserva: #fd7e14;}
        body.theme-jacqui.dark-mode { --primary: #148f77; --danger: #873600; --success: #27ae60; --reserva: #f39c12;}
        
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: 0.3s; }
        .container { max-width: 900px; margin: 0 auto; background: var(--box-bg); border-radius: 10px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        .detalle-layout { display: flex; gap: 30px; align-items: stretch; flex-wrap: wrap; }
        .poster-img-container { flex: 1; min-width: 280px; text-align: center; }
        .poster-img-container img { max-width: 100%; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); margin-bottom: 15px;}
        .info-container { flex: 2; min-width: 280px; }
        
        .badge { padding: 5px 10px; border-radius: 15px; font-size: 14px; background: var(--primary); color: white; margin-left: 10px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .stat-box { background: rgba(0,0,0,0.03); padding: 15px; border-radius: 8px; text-align: center; border: 1px solid var(--border-color); }
        body.dark-mode .stat-box { background: rgba(255,255,255,0.05); }
        .stat-box span { display: block; font-size: 24px; font-weight: bold; margin-top: 5px; }
        .highlight-green { color: var(--success); } .highlight-red { color: var(--danger); }
        
        button { border: none; cursor: pointer; border-radius: 5px; color: white; font-weight: bold; transition: 0.2s; width: 100%; box-sizing: border-box; }
        button:hover { opacity: 0.8; }
        .action-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 20px;}
        .btn-reserva { background: var(--reserva); padding: 15px; font-size: 16px; border-radius: 8px;}
        .btn-sacar { background: var(--primary); padding: 12px; }
        .btn-regresar { background: #6c757d; padding: 12px; }
        .btn-daño { background: var(--danger); padding: 12px; }
        .btn-dark { background: #212529; padding: 8px; } .btn-info { background: #0dcaf0; color: #000; padding: 8px; }
        
        .advertencia-corp { background: rgba(253, 126, 20, 0.1); border-left: 5px solid #fd7e14; padding: 15px; margin-bottom: 20px; font-size: 14px; border-radius: 4px;}
        
        .editor-imagen { background: rgba(0,0,0,0.02); padding: 15px; border-radius: 8px; border: 1px dashed #999; margin-top: 15px;}
        body.dark-mode .editor-imagen { background: rgba(255,255,255,0.02); }
        input[type="text"] { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid var(--border-color); box-sizing: border-box; background: var(--bg-color); color: var(--text-color);}
    </style>
</head>
<body>

<div class="container" id="tarjetaContenido">
    <h3 style="text-align:center;">Cargando información del póster...</h3>
</div>
<div id="modalMerma" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; z-index:9999;">
    <div style="background:var(--box-bg); padding:25px; border-radius:10px; width:90%; max-width:400px; text-align:center;">
        <h2 style="margin-top:0; color:var(--danger);">📸 Evidencia de Merma</h2>
        <p style="font-size:13px; color:gray;">Para desechar material, la Subgerencia debe validar la foto del daño.</p>
        
        <input type="number" id="cantMerma" placeholder="¿Cuántas piezas se dañaron?" min="1" style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #ccc; box-sizing:border-box;">
        <input type="text" id="motivoMerma" placeholder="Motivo (Ej. Roto por cliente, mojado...)" style="width:100%; padding:10px; margin-bottom:15px; border-radius:5px; border:1px solid #ccc; box-sizing:border-box;">
        
        <label style="display:block; text-align:left; font-size:12px; font-weight:bold; margin-bottom:5px;">Toma una foto de la zona dañada:</label>
        
        <input type="file" id="fotoMerma" accept="image/*" capture="environment" style="width:100%; margin-bottom:20px;">
        
        <div style="display:flex; justify-content:space-between;">
            <button onclick="document.getElementById('modalMerma').style.display='none'" style="background:#555; padding:10px; width:48%; border:none; color:white; border-radius:5px; font-weight:bold;">Cancelar</button>
            <button onclick="enviarMerma()" style="background:var(--danger); padding:10px; width:48%; border:none; color:white; border-radius:5px; font-weight:bold;">Enviar Foto</button>
        </div>
    </div>
</div>

<script>
    const API_URL = 'https://jonassk13.pythonanywhere.com/api/inventario';
    const API_RESERVAS = 'https://jonassk13.pythonanywhere.com/api/reservas';
    const urlParams = new URLSearchParams(window.location.search);
    const idProducto = urlParams.get('id');
    let prodGlobal = null;
    let rolUsuario = localStorage.getItem('rolCine') || 'General';


    
    window.onload = () => {
        if(!idProducto) { document.getElementById('tarjetaContenido').innerHTML = "<h1>No se especificó un producto.</h1>"; return; }
        if(localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode');
        if(rolUsuario === 'Subgerente') document.body.classList.add('theme-jacqui');
        cargarDetalle();
    };

    function cargarDetalle() {
        fetch(`${API_URL}/${idProducto}`).then(res => res.json()).then(data => {
            if(data.error) { document.getElementById('tarjetaContenido').innerHTML = "<h1>Producto no encontrado.</h1>"; return; }
            prodGlobal = data;
            renderizarTarjeta();
            if(prodGlobal.Imagen_URL) {
                document.getElementById('imagenMagicaPoster').src = prodGlobal.Imagen_URL;
                document.getElementById('imagenMagicaPoster').style.display = 'inline-block';
            }
        });
    }

    function abrirModalMerma() { document.getElementById('modalMerma').style.display = 'flex'; }
    
    function enviarMerma() {
        const cant = document.getElementById('cantMerma').value;
        const motivo = document.getElementById('motivoMerma').value.trim();
        const fotoInput = document.getElementById('fotoMerma');
        
        if(!cant || cant <= 0 || !motivo || fotoInput.files.length === 0) {
            alert("⚠️ Debes llenar la cantidad, el motivo y OBLIGATORIAMENTE subir la foto."); return;
        }

        const btn = event.target;
        btn.innerText = "Subiendo Evidencia..."; btn.disabled = true;

        const reader = new FileReader();
        reader.onload = function(e) {
            const base64Img = e.target.result;
            
            fetch('https://jonassk13.pythonanywhere.com/api/mermas', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id_pub: idProducto, usuario: localStorage.getItem('nombreCine') || rolUsuario, cantidad: parseInt(cant), motivo: motivo, foto: base64Img })
            }).then(() => {
                alert("✅ Fotografía enviada al sistema. Esperando que la Subgerente o el Admin autoricen tirarlo.");
                document.getElementById('modalMerma').style.display = 'none';
                btn.innerText = "Enviar Foto"; btn.disabled = false;
            });
        };
        reader.readAsDataURL(fotoInput.files[0]);
    }

function renderizarTarjeta() {
        let botonesHTML = '';
        let panelEditor = '';
        let advertenciaCinepolitos = '';
        
        let articulo = "este";
        let catLower = prodGlobal.Categoria.toLowerCase();
        if(catLower.includes('palomera') || catLower.includes('lona') || catLower.includes('área') || catLower.includes('area')) articulo = "esta";
        
        if(rolUsuario === 'Admin' || rolUsuario === 'Supervisor' || rolUsuario === 'Publicista' || rolUsuario === 'Visitante' || rolUsuario === 'Subgerente') {
            
            advertenciaCinepolitos = `
                <div class="advertencia-corp">
                    ⚠️ <b>Importante:</b> Al solicitar ${articulo} <b>${prodGlobal.Categoria}</b>, entras en una lista de espera. <b>Deberás esperar a que baje de exhibición</b> y la entrega final estará sujeta a que los de <b>Corporativo no exijan su devolución</b>.
                </div>
            `;
            
            botonesHTML += `<button class="btn-reserva" onclick="hacerReserva()">📋 Quiero pedir ${articulo} ${prodGlobal.Categoria} a mi nombre</button>`;
            
            if (rolUsuario === 'Admin' || rolUsuario === 'Supervisor' || rolUsuario === 'Subgerente') {
                panelEditor = `
                    <div class="editor-imagen">
                        <label style="font-size: 11px; font-weight: bold; color: gray;">¿Imagen incorrecta?</label>
                        <button class="btn-dark" style="margin-bottom: 5px;" onclick="buscarEnGoogle()">🔍 Buscar en Google</button>
                        <input type="text" id="urlManual" placeholder="Pega el link de la imagen (.jpg, .png)...">
                        <button class="btn-info" onclick="guardarImagenManual()">💾 Guardar Imagen</button>
                    </div>
                `;
                botonesHTML += `
                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
                    <button class="btn-sacar" onclick="registrarMovimiento('salida')">📤 Sacar a Piso (Directo)</button>
                    <button class="btn-regresar" onclick="registrarMovimiento('regreso')">📥 Regresar a Bodega</button>
                    <button class="btn-daño" onclick="abrirModalMerma()">📸 Tomar Foto para Merma</button>
                `;
            }
        }

        document.getElementById('tarjetaContenido').innerHTML = `
            <div class="detalle-layout">
                <div class="poster-img-container">
                    <img id="imagenMagicaPoster" src="" style="display:none;" alt="Imagen Oficial">
                    ${panelEditor}
                </div>
                <div class="info-container">
                    <h1 style="font-size: 22px; margin-top:0;">${prodGlobal.Nombre_Material} <span class="badge">${prodGlobal.Categoria}</span></h1>
                    ${advertenciaCinepolitos}
                    <div class="stats-grid">
                        <div class="stat-box">En Bodega <span class="highlight-green">${prodGlobal.Cantidad_Guardados}</span></div>
                        <div class="stat-box">En Exhibición <span class="highlight-red">${prodGlobal.Cantidad_Cartelera}</span></div>
                    </div>
                    <div class="action-grid">${botonesHTML}</div>
                </div>
            </div>
        `;
    }        let botonesHTML = '';
        let panelEditor = '';
        let advertenciaCinepolitos = '';
        
        if(rolUsuario === 'Admin' || rolUsuario === 'Supervisor' || rolUsuario === 'Publicista' || rolUsuario === 'Visitante' || rolUsuario === 'Subgerente') {
            
            advertenciaCinepolitos = `
                <div class="advertencia-corp">
                    ⚠️ <b>Importante:</b> Al solicitar este póster, entras en una lista de espera. <b>Deberás esperar a que baje de cartelera</b> y la entrega final estará sujeta a que los de <b>Corporativo no exijan la devolución del material</b>.
                </div>
            `;
            
            botonesHTML += `<button class="btn-reserva" onclick="hacerReserva()">📋 Quiero pedir este póster a mi nombre</button>`;
            
            if (rolUsuario === 'Admin' || rolUsuario === 'Supervisor' || rolUsuario === 'Subgerente') {
                panelEditor = `
                    <div class="editor-imagen">
                        <label style="font-size: 11px; font-weight: bold; color: gray;">¿Imagen incorrecta o no aparece?</label>
                        <button class="btn-dark" style="margin-bottom: 5px;" onclick="buscarEnGoogle()">🔍 Buscar en Google</button>
                        <input type="text" id="urlManual" placeholder="Pega el link de la imagen (.jpg, .png) aquí...">
                        <button class="btn-info" onclick="guardarImagenManual()">💾 Guardar Imagen</button>
                    </div>
                `;
                
                botonesHTML += `
                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
                    <button class="btn-sacar" onclick="registrarMovimiento('salida')">📤 Sacar a Piso (Directo)</button>
                    <button class="btn-regresar" onclick="registrarMovimiento('regreso')">📥 Regresar a Bodega</button>
                    <button class="btn-daño" onclick="abrirModalMerma()">📸 Tomar Foto para Merma</button>`;
            }
        }

        document.getElementById('tarjetaContenido').innerHTML = `
            <div class="detalle-layout">
                <div class="poster-img-container">
                    <img id="imagenMagicaPoster" src="" style="display:none;" alt="Poster Oficial">
                    ${panelEditor}
                </div>
                <div class="info-container">
                    <h1 style="font-size: 22px; margin-top:0;">${prodGlobal.Nombre_Material} <span class="badge">${prodGlobal.Categoria}</span></h1>
                    ${advertenciaCinepolitos}
                    <div class="stats-grid">
                        <div class="stat-box">En Bodega <span class="highlight-green">${prodGlobal.Cantidad_Guardados}</span></div>
                        <div class="stat-box">En Exhibición <span class="highlight-red">${prodGlobal.Cantidad_Cartelera}</span></div>
                    </div>
                    <div class="action-grid">
                        ${botonesHTML}
                    </div>
                </div>
            </div>
        `;


    function hacerReserva() {
        let nombreGuardado = localStorage.getItem('nombreCinepolito') || '';
        let nombre = prompt("Ingresa tu nombre completo (y tu área, Ej. 'Jonas - Dulcería'):", nombreGuardado);
        if(!nombre) return;
        
        localStorage.setItem('nombreCinepolito', nombre.trim());
        
        let cant = prompt(`¿Cuántas piezas de este(a) ${prodGlobal.Categoria} quieres pedir?`);
        cant = parseInt(cant);
        if(!cant || cant <= 0) return;
        
        fetch(API_RESERVAS, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id_publicidad: idProducto, nombre: nombre.trim(), cantidad: cant })
        }).then(() => {
            alert(`¡Listo! Tu pedido quedó registrado a nombre de: ${nombre.trim()}.\n\nPuedes revisar si ya fue aprobado en la pantalla principal en el botón "Mis Pedidos".`);
        });
    }

    function registrarMovimiento(tipo) {
        let cant = prompt(`¿Cuántas piezas vas a mover para la operación de: ${tipo}?`);
        cant = parseInt(cant);
        if(!cant || cant <= 0) return;
        fetch(`${API_URL}/${idProducto}/movimiento`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tipo: tipo, cantidad: cant }) }).then(() => cargarDetalle());
    }

    function buscarEnGoogle() { window.open(`https://www.google.com/search?tbm=isch&q=poster+película+${encodeURIComponent(prodGlobal.Nombre_Material)}`, '_blank'); }
    function guardarImagenManual() {
        const url = document.getElementById('urlManual').value.trim();
        if(!url) return alert("Pega una URL válida.");
        fetch(`${API_URL}/${idProducto}/imagen`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: url }) }).then(() => cargarDetalle());
    }
</script>
</body>
</html>
