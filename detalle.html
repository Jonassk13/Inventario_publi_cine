<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Material</title>
    <style>
        /* 👑 TEMA VIP DE JACQUELINE */
        body.theme-jacqui {
            --primary: #0b5345; --btn-primary: #0b5345; 
            --success: #1e8449; --btn-success: #1e8449;
            --danger: #6e2c00; --btn-danger: #6e2c00;
            --info: #aec6cf; --btn-info: #aec6cf; 
            --warning: #fd7e14; --btn-reserva: #fd7e14; --admin-bg: #fd7e14;
        }
        body.theme-jacqui.dark-mode { --primary: #148f77; --btn-primary: #148f77; --danger: #873600; --btn-danger: #873600; }
        :root { --bg-color: #e9ecef; --text-color: #333; --box-bg: #fff; --border-color: #ddd; --th-bg: #f1f1f1; }
        body.dark-mode { --bg-color: #121212; --text-color: #e0e0e0; --box-bg: #1e1e1e; --border-color: #444; --th-bg: #2c2c2c; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; box-sizing: border-box; transition: 0.3s;}

        .theme-toggle { background: #333; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; display: block; margin: 0 auto 20px auto; font-weight: bold;}
        body.dark-mode .theme-toggle { background: #f8f9fa; color: #121212; }

        .card { background: var(--box-bg); padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); max-width: 800px; margin: 0 auto; border: 1px solid var(--border-color); transition: 0.3s;}
        
        .detalle-layout { display: flex; gap: 20px; align-items: flex-start; }
        .poster-img-container { width: 40%; text-align: center; }
        .poster-img-container img { width: 100%; border-radius: 8px; box-shadow: 0 6px 12px rgba(0,0,0,0.3); border: 2px solid var(--border-color); object-fit: cover; }
        .info-container { width: 60%; }

        h1 { color: #17a2b8; margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 24px;}
        .badge { background: #ffc107; color: #000; font-size: 14px; padding: 5px 10px; border-radius: 15px; font-weight: bold;}

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .stat-box { background: var(--bg-color); padding: 15px; border-radius: 8px; text-align: center; font-size: 16px; font-weight: bold; border: 1px solid var(--border-color); transition: 0.3s;}
        .highlight-green { color: #28a745; font-size: 22px; display: block; margin-top: 5px;}
        .highlight-red { color: #dc3545; font-size: 22px; display: block; margin-top: 5px;}

        .action-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 20px;}
        button { border: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s;}
        button:hover { opacity: 0.8; }
        .btn-sacar { background: #0d6efd; } .btn-regresar { background: #198754; } .btn-daño { background: #dc3545; } .btn-reserva { background: #6f42c1; }
        .btn-dark { background: #212529; } .btn-info { background: #0dcaf0; color: #000; }

        .editor-imagen { margin-top: 15px; text-align: left; background: rgba(0,0,0,0.05); padding: 10px; border-radius: 8px; border: 1px dashed var(--border-color); }
        body.dark-mode .editor-imagen { background: rgba(255,255,255,0.05); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid var(--border-color); padding: 8px; text-align: left; }
        th { background: var(--th-bg); }
        
        @media (max-width: 600px) {
            .detalle-layout { flex-direction: column; align-items: center; }
            .poster-img-container, .info-container { width: 100%; }
            .poster-img-container img { width: 60%; }
        }
    </style>
</head>
<body>

<button class="theme-toggle" onclick="toggleDarkMode()">🌙 / ☀️</button>

<div class="card" id="tarjetaContenido">
    <h2 style="text-align:center;">Cargando datos del material...</h2>
</div>

<script>
    
    window.onload = () => {
        if(localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode');
        if(localStorage.getItem('rolCine') === 'Subgerente') { document.body.classList.add('theme-jacqui'); }
    };
    function toggleDarkMode() { document.body.classList.toggle('dark-mode'); localStorage.setItem('darkMode', document.body.classList.contains('dark-mode')); }

    const urlParams = new URLSearchParams(window.location.search);
    const idProd = urlParams.get('id');
    const API_BASE = 'https://jonassk13.pythonanywhere.com/api/inventario';
    const API_RESERVAS = 'https://jonassk13.pythonanywhere.com/api/reservas';
    let prodGlobal = null;
    const rolUsuario = localStorage.getItem('rolCine') || 'General';

    if (idProd) { cargarDatos(); } 
    else { document.getElementById('tarjetaContenido').innerHTML = `<h2 style="color:red; text-align:center;">Falta el ID del producto.</h2>`; }

    function cargarDatos() {
        fetch(`${API_BASE}/${idProd}`).then(res => res.json()).then(data => {
            prodGlobal = data;
            renderizarTarjeta();
            cargarImagen();
        });
    }

    function cargarImagen() {
        const imgElement = document.getElementById('imagenMagicaPoster');
        
        if (prodGlobal.Imagen_URL && prodGlobal.Imagen_URL.trim() !== "") {
            imgElement.src = prodGlobal.Imagen_URL;
            imgElement.style.display = 'block';
            return;
        }

        let nombreLimpio = prodGlobal.Nombre_Material.replace(/poster|cartel|loneta|esp|sub|3d|imax|4dx|sj|xe|atmos|sp|led|screenx|2d/gi, '').trim();
        fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(nombreLimpio)}&entity=movie&limit=1`)
        .then(res => res.json())
        .then(apiData => {
            if(apiData.results && apiData.results.length > 0) {
                imgElement.src = apiData.results[0].artworkUrl100.replace('100x100bb', '600x900bb');
            } else {
                imgElement.src = `https://via.placeholder.com/600x900/1e1e1e/0dcaf0?text=Poster+No+Disponible`;
            }
            imgElement.style.display = 'block';
        })
        .catch(() => {
            imgElement.src = `https://via.placeholder.com/600x900/1e1e1e/dc3545?text=Error+de+Conexion`;
            imgElement.style.display = 'block';
        });
    }

    function buscarEnGoogle() {
        let nombreLimpio = prodGlobal.Nombre_Material.replace(/esp|sub|3d|imax|4dx|sj|xe|atmos|sp|led|screenx|2d/gi, '').trim();
        let query = encodeURIComponent(`Poster Película Cinépolis ${nombreLimpio}`);
        window.open(`https://www.google.com/search?tbm=isch&q=${query}`, '_blank');
    }

    function guardarImagenManual() {
        const nuevaUrl = document.getElementById('urlManual').value.trim();
        if (!nuevaUrl) return alert("Pega el link de la imagen primero.");
        
        fetch(`${API_BASE}/${idProd}/imagen`, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: nuevaUrl })
        }).then(() => {
            alert("✅ Imagen actualizada para todos los usuarios.");
            cargarDatos();
        });
    }

    function renderizarTarjeta() {
        let botonesHTML = '';
        let panelEditor = '';
        
        if(rolUsuario === 'Admin' || rolUsuario === 'Supervisor' || rolUsuario === 'Publicista' || rolUsuario === 'Visitante') {
            
            botonesHTML += `<button class="btn-reserva" onclick="hacerReserva()" style="font-size: 16px; padding: 12px; margin-bottom: 10px;">📋 Quiero pedir este póster</button>`;
            
            if (rolUsuario === 'Admin' || rolUsuario === 'Supervisor') {
                panelEditor = `
                    <div class="editor-imagen">
                        <label style="font-size: 11px; font-weight: bold; color: gray;">¿Imagen incorrecta o no aparece?</label>
                        <button class="btn-dark" style="width: 100%; margin-bottom: 5px; font-size: 12px; padding: 6px;" onclick="buscarEnGoogle()">🔍 Buscar en Google</button>
                        <input type="text" id="urlManual" placeholder="Pega el link (URL) aquí..." style="width: 90%; font-size: 12px; padding: 6px; margin-bottom: 5px; border: 1px solid var(--border-color); border-radius: 4px;">
                        <button class="btn-info" style="width: 100%; font-size: 12px; padding: 6px;" onclick="guardarImagenManual()">💾 Guardar Imagen</button>
                    </div>
                `;
                
                botonesHTML += `
                    <button class="btn-sacar" onclick="registrarMovimiento('salida')">📤 Sacar a Piso (Directo)</button>
                    <button class="btn-regresar" onclick="registrarMovimiento('regreso')">📥 Regresar a Bodega</button>
                    <button class="btn-daño" onclick="registrarMovimiento('desecho')">🗑️ Reportar Merma</button>
                `;
            }
        }

        document.getElementById('tarjetaContenido').innerHTML = `
            <div class="detalle-layout">
                <div class="poster-img-container">
                    <img id="imagenMagicaPoster" src="" style="display:none;" alt="Poster Oficial">
                    ${panelEditor}
                </div>
                <div class="info-container">
                    <h1 style="font-size: 18px;">${prodGlobal.Nombre_Material} <span class="badge">${prodGlobal.Categoria}</span></h1>
                    <div class="stats-grid">
                        <div class="stat-box">En Bodega <span class="highlight-green">${prodGlobal.Cantidad_Guardados}</span></div>
                        <div class="stat-box">En Exhibición <span class="highlight-red">${prodGlobal.Cantidad_Cartelera}</span></div>
                    </div>
                    <div class="action-grid">
                        ${botonesHTML}
                    </div>
                </div>
            </div>
        `;
    }
    function registrarMovimiento(tipo) {
        let cantidad = prompt("¿Cuántas piezas?");
        if (!cantidad || isNaN(cantidad) || cantidad <= 0) return;
        fetch(`${API_BASE}/${idProd}/movimiento`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tipo, cantidad: parseInt(cantidad) }) }).then(() => cargarDatos());
    }

    function hacerReserva() {
        let nombre = prompt("¿Quién solicita el material?");
        if(!nombre) return;
        let cantidad = prompt("¿Cuántos necesitas apartar?");
        if(!cantidad || isNaN(cantidad) || cantidad <= 0) return;
        
        fetch(API_RESERVAS, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id_publicidad: idProd, nombre, cantidad: parseInt(cantidad) }) }).then(() => { 
            alert(`✅ Solicitud enviada a los supervisores para su autorización.`); cargarDatos(); 
        });
    }
</script>
</body>
</html>
