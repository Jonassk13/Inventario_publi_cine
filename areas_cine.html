<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muro: Áreas del Cine</title>
    <style>
        :root { --bg-color: #f4f7f6; --text-color: #333; --box-bg: #fff; --primary: #d35400; --border-color: #ddd;}
        body.dark-mode { --bg-color: #121212; --text-color: #e0e0e0; --box-bg: #1e1e1e; --border-color: #444;}
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px;}
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--box-bg); padding: 15px; border-radius: 8px; border-top: 5px solid var(--primary);}
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: var(--box-bg); border-radius: 10px; padding: 15px; border: 1px solid var(--border-color); text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05);}
        .card img { max-width: 100%; height: 200px; object-fit: contain; border-radius: 5px; margin-bottom: 10px; background: rgba(0,0,0,0.05);}
        .card h3 { margin: 5px 0; font-size: 16px; color: var(--primary);}
        .btn-abrir { background: #212529; color: white; padding: 8px; border: none; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; text-decoration: none; display: inline-block;}
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0;">🏢 Activos: Áreas del Cine</h1>
    <button onclick="document.body.classList.toggle('dark-mode')" style="padding: 10px; background:#222; color:white; border-radius:5px; border:none; cursor:pointer;">🌙 / ☀️</button>
</div>

<div class="grid" id="muroGrid"><h3 style="text-align:center; grid-column:1/-1;">Cargando activos...</h3></div>

<script>
    const API_INVENTARIO = 'https://jonassk13.pythonanywhere.com/api/inventario';
    let rol = localStorage.getItem('rolCine');
    
    window.onload = () => {
        if(localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode');
        if(rol === 'Visitante' || rol === 'General') {
            document.body.innerHTML = "<h1 style='text-align:center; color:red; margin-top:50px;'>⛔ ACCESO RESTRINGIDO ⛔</h1>"; return;
        }
        
        fetch(API_INVENTARIO).then(r => r.json()).then(data => {
            let activos = data.filter(p => p.Categoria === 'Áreas del Cine');
            activos.sort((a, b) => a.Nombre_Material.localeCompare(b.Nombre_Material));
            
            const grid = document.getElementById('muroGrid'); grid.innerHTML = '';
            if(activos.length === 0) grid.innerHTML = "<p style='text-align:center; grid-column:1/-1;'>No hay activos registrados en esta categoría.</p>";
            
            activos.forEach(p => {
                let img = p.Imagen_URL ? `<img src="${p.Imagen_URL}">` : `<div style="height:200px; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.05); color:gray; border-radius:5px;">Sin Foto</div>`;
                grid.innerHTML += `<div class="card">${img}<h3>${p.Nombre_Material}</h3><p style="margin:0; font-size:13px;">Stock: <b>${p.Cantidad_Guardados}</b> | Exhibición: <b>${p.Cantidad_Cartelera}</b></p><a href="detalle.html?id=${p.ID_Publicidad}" target="_blank" class="btn-abrir">Ver Ficha Técnica</a></div>`;
            });
        });
    }
</script>
</body>
</html>
