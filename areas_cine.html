<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 Paquetes y Áreas del Cine</title>
    <style>
        :root { --bg-color: #f4f7f6; --text-color: #333; --box-bg: #fff; --primary: #d35400; --border-color: #ddd; --danger: #dc3545;}
        body.dark-mode { --bg-color: #121212; --text-color: #e0e0e0; --box-bg: #1e1e1e; --border-color: #444;}
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px;}
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--box-bg); padding: 15px; border-radius: 8px; border-top: 5px solid var(--primary); box-shadow: 0 4px 6px rgba(0,0,0,0.05);}
        button { cursor: pointer; border-radius: 5px; font-weight: bold; border: none; padding: 10px 15px; transition: 0.2s; color: white;}
        button:hover { opacity: 0.8; }
        .btn-primary { background: var(--primary); } .btn-dark { background: #222; } .btn-danger { background: var(--danger); padding: 5px 10px; font-size: 12px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--box-bg); border-radius: 10px; padding: 15px; border: 1px solid var(--border-color); box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: relative;}
        
        .card-img-container { height: 250px; background: #000; border-radius: 5px; overflow: hidden; margin-bottom: 15px; position: relative; cursor: pointer;}
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: 0.3s;}
        .card-img-container:hover img { opacity: 1; transform: scale(1.05); }
        .img-overlay-text { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 5px; font-size: 12px; font-weight: bold; pointer-events: none;}
        
        .card h3 { margin: 0 0 10px 0; color: var(--primary); font-size: 20px;}
        .fecha-text { font-size: 12px; color: gray; margin-bottom: 15px; display: block; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;}
        
        .item-list { margin: 0; padding: 0; list-style: none; font-size: 14px;}
        .item-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed var(--border-color);}
        
        .btn-delete-card { position: absolute; top: 10px; right: 10px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 14px; display: flex; align-items: center; justify-content: center; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.5);}

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--box-bg); padding: 25px; border-radius: 10px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto;}
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid var(--border-color); box-sizing: border-box; background: var(--bg-color); color: var(--text-color);}
        
        .fila-item { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .fila-item input { margin-bottom: 0; }
    </style>
</head>
<body>

<div class="header">
    <div>
        <h1 style="margin:0;">📦 Paquetes: Áreas del Cine</h1>
        <p style="margin: 5px 0 0 0; font-size: 12px; color: gray;">Módulo exclusivo para Admin y Subgerencia</p>
    </div>
    <div style="display: flex; gap: 10px;">
        <button class="btn-primary" onclick="abrirModalCrear()">+ Registrar Nuevo Paquete</button>
        <button class="btn-dark" onclick="toggleDarkMode()">🌙 / ☀️</button>
    </div>
</div>

<div class="grid" id="muroGrid"><h3 style="text-align:center; grid-column:1/-1;">Cargando inventario de cajas...</h3></div>

<div id="modalCaja" class="modal">
    <div class="modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin-top: 0; color: var(--primary);">Registrar Nueva Caja/Paquete</h2>
            <button onclick="document.getElementById('modalCaja').style.display='none'" style="background:none; color:var(--text-color); font-size:20px; padding:0;">&times;</button>
        </div>
        
        <label style="font-weight: bold; font-size: 13px;">Identificador del Paquete:</label>
        <input type="text" id="nombreCaja" placeholder="Ej. Conjunto C038 DHL" required>
        
        <label style="font-weight: bold; font-size: 13px;">Fotografía de la Hoja de Envío / Guía:</label>
        <input type="file" id="fotoGuia" accept="image/*" style="width: 100%; margin-bottom: 20px; padding: 10px; border: 1px dashed var(--border-color); border-radius: 5px;">
        
        <h3 style="margin-top: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">Contenido del Paquete</h3>
        <div id="contenedorItems"></div>
        
        <button class="btn-dark" style="width: 100%; margin-bottom: 20px;" onclick="agregarFilaItem()">+ Añadir otro producto a la lista</button>
        
        <button id="btnGuardarPaquete" class="btn-primary" style="width: 100%; font-size: 16px; padding: 15px;" onclick="guardarCaja()">💾 Guardar Paquete en Inventario</button>
    </div>
</div>

<script>
    const API_CAJAS = 'https://jonassk13.pythonanywhere.com/api/cajas_areas';
    let rol = localStorage.getItem('rolCine');
    let usuarioAct = localStorage.getItem('nombreCine') || rol;
    
    window.onload = () => {
        if(localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode');
        if(rol === 'Visitante' || rol === 'General') {
            document.body.innerHTML = "<h1 style='text-align:center; color:red; margin-top:50px;'>⛔ ACCESO RESTRINGIDO ⛔</h1>"; return;
        }
        cargarCajas();
    }

    function toggleDarkMode() { document.body.classList.toggle('dark-mode'); localStorage.setItem('darkMode', document.body.classList.contains('dark-mode')); }

    function cargarCajas() {
        fetch(API_CAJAS).then(r => r.json()).then(cajas => {
            const grid = document.getElementById('muroGrid'); grid.innerHTML = '';
            if(cajas.length === 0) grid.innerHTML = "<p style='text-align:center; grid-column:1/-1; color:gray;'>No hay paquetes registrados.</p>";
            
            cajas.forEach(c => {
                let imgHTML = c.Imagen_URL ? `<img src="${c.Imagen_URL}" onclick="abrirFotoGrande('${c.Imagen_URL}')"><div class="img-overlay-text">🔍 Ver Hoja Original</div>` : `<div style="display:flex; height:100%; align-items:center; justify-content:center; color:gray; background:rgba(0,0,0,0.5);">Sin Imagen</div>`;
                
                let listaItems = c.items.map(item => `
                    <li class="item-row">
                        <span>${item.Nombre_Material}</span>
                        <strong>${item.Cantidad_Guardados} pz</strong>
                    </li>
                `).join('');

                grid.innerHTML += `
                    <div class="card">
                        <button class="btn-delete-card" onclick="eliminarCaja(${c.ID_Caja})" title="Eliminar Paquete Completo">🗑️</button>
                        <div class="card-img-container">${imgHTML}</div>
                        <h3>${c.Nombre}</h3>
                        <span class="fecha-text">Recibido: ${c.Fecha}</span>
                        <ul class="item-list">${listaItems}</ul>
                    </div>
                `;
            });
        });
    }

    function abrirModalCrear() {
        document.getElementById('nombreCaja').value = '';
        document.getElementById('fotoGuia').value = '';
        document.getElementById('contenedorItems').innerHTML = '';
        agregarFilaItem(); 
        document.getElementById('modalCaja').style.display = 'flex';
    }

    function agregarFilaItem() {
        const div = document.createElement('div');
        div.className = 'fila-item';
        div.innerHTML = `
            <input type="text" class="item-nombre" placeholder="Nombre del producto (Ej. Standee Reglas Uso)" style="flex: 3;" required>
            <input type="number" class="item-cant" placeholder="Cant." min="1" value="1" style="flex: 1;" required>
            <button class="btn-danger" onclick="this.parentElement.remove()">X</button>
        `;
        document.getElementById('contenedorItems').appendChild(div);
    }

    function guardarCaja() {
        const nombre = document.getElementById('nombreCaja').value.trim();
        const fotoInput = document.getElementById('fotoGuia');
        
        if(!nombre) return alert("Falta el identificador del paquete.");
        
        let productos = [];
        document.querySelectorAll('.fila-item').forEach(fila => {
            let nom = fila.querySelector('.item-nombre').value.trim();
            let cant = parseInt(fila.querySelector('.item-cant').value);
            if(nom && cant > 0) productos.push({nombre: nom, cantidad: cant});
        });
        
        if(productos.length === 0) return alert("Debes agregar al menos 1 producto a la caja.");

        const btnGuardar = document.getElementById('btnGuardarPaquete');
        btnGuardar.innerText = "Procesando..."; btnGuardar.disabled = true;

        const enviarDatos = (base64Img) => {
            fetch(API_CAJAS, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre: nombre, imagen: base64Img, productos: productos, usuario: usuarioAct })
            }).then(() => {
                document.getElementById('modalCaja').style.display = 'none';
                btnGuardar.innerText = "💾 Guardar Paquete en Inventario"; btnGuardar.disabled = false;
                cargarCajas();
            });
        };

        if (fotoInput.files.length > 0) {
            const reader = new FileReader();
            reader.onload = function(e) { enviarDatos(e.target.result); };
            reader.readAsDataURL(fotoInput.files[0]);
        } else {
            enviarDatos("");
        }
    }

    function eliminarCaja(id_caja) {
        if(confirm("⚠️ ATENCIÓN: Al borrar este paquete se eliminarán también TODOS los productos que contiene de la base de datos general.\n\n¿Estás completamente seguro?")) {
            fetch(`${API_CAJAS}/${id_caja}`, { method: 'DELETE' }).then(() => cargarCajas());
        }
    }

    function abrirFotoGrande(base64Data) {
        const nuevaPestana = window.open();
        nuevaPestana.document.write(`<html><head><title>Hoja de Recepción</title></head><body style="margin:0; background:#111; display:flex; justify-content:center; align-items:center; height:100vh;"><img src="${base64Data}" style="max-width:100%; max-height:100%; object-fit:contain; box-shadow: 0 0 20px rgba(0,0,0,0.8);"></body></html>`);
        nuevaPestana.document.close();
    }
</script>
</body>
</html>
