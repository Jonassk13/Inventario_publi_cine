<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mapa de Carteleras</title>
    <style>
        :root { --bg-color: #f4f7f6; --text-color: #333; --box-bg: #fff; --border-color: #ddd; --primary: #0d6efd; --success: #198754; --danger: #dc3545;}
        body.dark-mode { --bg-color: #121212; --text-color: #e0e0e0; --box-bg: #1e1e1e; --border-color: #444; --primary: #6ea8fe; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: 0.3s;}
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--box-bg); padding: 15px; border-radius: 8px;}
        button.btn { padding: 10px 15px; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; color: white; transition: 0.2s; }
        button.btn:hover { opacity: 0.8; }
        .btn-dark { background: #212529; } .btn-primary { background: var(--primary); } .btn-danger { background: var(--danger); }

        /* ESTILOS DEL PLANO DEL CINE */
        .mapa-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1000px; margin: 0 auto;}
        .zona { border: 3px solid var(--border-color); background: var(--box-bg); border-radius: 10px; padding: 20px; position: relative;}
        .zona-titulo { position: absolute; top: -15px; left: 20px; background: var(--box-bg); padding: 0 10px; font-weight: bold; color: var(--primary);}
        
        .slots-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;}
        .slot { border: 2px dashed #999; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: 0.2s; background: rgba(0,0,0,0.02); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80px;}
        .slot:hover { border-color: var(--primary); background: rgba(13, 110, 253, 0.1); }
        .slot.lleno { border: 2px solid var(--success); background: rgba(25, 135, 84, 0.1); border-style: solid;}
        
        .slot-numero { font-size: 12px; color: gray; margin-bottom: 5px;}
        .slot-titulo { font-weight: bold; font-size: 16px; margin-bottom: 10px;}
        .poster-nombre { font-size: 18px; color: var(--primary); font-weight: bold;}

        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--box-bg); padding: 25px; border-radius: 10px; width: 90%; max-width: 500px; }
        select { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0;">🗺️ Mapa de Control de Exhibición</h1>
    <button class="btn btn-dark" onclick="toggleDarkMode()">🌙 / ☀️</button>
</div>

<!-- PLANO VIRTUAL DEL LOBBY -->
<div class="mapa-container" id="planoCine">
    <!-- Se dibuja dinámicamente -->
    <h3 style="text-align:center; grid-column: span 2;">Cargando distribución de salas...</h3>
</div>

<!-- MODAL PARA ELEGIR POSTER -->
<div id="modalAsignar" class="modal">
    <div class="modal-content">
        <h2 style="margin-top:0;">Colocar Póster en Cartelera</h2>
        <p id="textoUbicacion">Selecciona un material de la bodega para exhibirlo aquí:</p>
        
        <select id="selectorPosters">
            <option value="">Cargando pósters en bodega...</option>
        </select>
        
        <div style="display:flex; justify-content: space-between; margin-top: 20px;">
            <button class="btn btn-dark" onclick="cerrarModal()">Cancelar</button>
            <button class="btn btn-primary" onclick="guardarAsignacion()">Instalar Póster</button>
        </div>
    </div>
</div>

<script>
    const API_CARTELERAS = 'https://jonassk13.pythonanywhere.com/api/carteleras';
    const API_INVENTARIO = 'https://jonassk13.pythonanywhere.com/api/inventario';
    let slotSeleccionado = null;

    window.onload = () => {
        if(localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode');
        cargarMapa();
    };

    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
    }

    function cargarMapa() {
        fetch(API_CARTELERAS).then(res => res.json()).then(data => {
            const plano = document.getElementById('planoCine');
            plano.innerHTML = '';
            
            // Agrupamos visualmente los slots en el plano
            let zonasHTML = `
                <div class="zona"><div class="zona-titulo">🎟️ Entrada y Taquilla</div><div class="slots-grid">
                    ${crearSlotHTML(data[0])} ${crearSlotHTML(data[1])}
                </div></div>
                <div class="zona"><div class="zona-titulo">🍿 Zona de Dulcería</div><div class="slots-grid">
                    ${crearSlotHTML(data[2])} ${crearSlotHTML(data[3])}
                </div></div>
                <div class="zona" style="grid-column: span 2;"><div class="zona-titulo">🎬 Pasillos a Salas</div><div class="slots-grid">
                    ${crearSlotHTML(data[4])} ${crearSlotHTML(data[5])}
                </div></div>
            `;
            plano.innerHTML = zonasHTML;
        });
    }

    function crearSlotHTML(cartelera) {
        if(!cartelera) return '';
        const estaLleno = cartelera.ID_Publicidad !== null;
        const clase = estaLleno ? 'slot lleno' : 'slot';
        const contenido = estaLleno 
            ? `<span class="poster-nombre">${cartelera.Nombre_Material}</span><br><button class="btn btn-danger" style="margin-top:10px; font-size:12px; padding:5px;" onclick="liberarCartelera(event, ${cartelera.ID_Slot})">Quitar y Regresar a Bodega</button>`
            : `<span style="color:gray;">Espacio Vacío</span><br><span style="font-size:12px; margin-top:5px;">Clic para colocar póster</span>`;

        return `
            <div class="${clase}" onclick="abrirAsignacion(${cartelera.ID_Slot}, '${cartelera.Ubicacion}', ${estaLleno})">
                <div class="slot-numero">Espacio #${cartelera.ID_Slot}</div>
                <div class="slot-titulo">${cartelera.Ubicacion}</div>
                ${contenido}
            </div>
        `;
    }

    function abrirAsignacion(idSlot, ubicacion, estaLleno) {
        if(estaLleno) return; // Si está lleno, el clic lo ignora (se usa el botón rojo de quitar)
        
        slotSeleccionado = idSlot;
        document.getElementById('textoUbicacion').innerHTML = `Selecciona un material para: <strong>${ubicacion}</strong>`;
        document.getElementById('modalAsignar').style.display = 'flex';

        // Cargar inventario para llenar el select (solo los que tienen stock en bodega)
        fetch(API_INVENTARIO).then(res => res.json()).then(data => {
            const select = document.getElementById('selectorPosters');
            select.innerHTML = '<option value="">-- Elige un póster disponible --</option>';
            data.forEach(p => {
                if (p.Cantidad_Guardados > 0 && p.Categoria === 'Poster') {
                    select.innerHTML += `<option value="${p.ID_Publicidad}">${p.Nombre_Material} (Bodega: ${p.Cantidad_Guardados})</option>`;
                }
            });
        });
    }

    function cerrarModal() { document.getElementById('modalAsignar').style.display = 'none'; slotSeleccionado = null; }

    function guardarAsignacion() {
        const idPub = document.getElementById('selectorPosters').value;
        if(!idPub) return alert("Selecciona un póster primero.");

        fetch(`${API_CARTELERAS}/${slotSeleccionado}/asignar`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id_publicidad: parseInt(idPub) })
        }).then(() => { cerrarModal(); cargarMapa(); });
    }

    function liberarCartelera(event, idSlot) {
        event.stopPropagation(); // Evita que se abra el modal de asignar
        if(confirm("¿Seguro que deseas quitar este póster de la cartelera y regresarlo al inventario de la bodega?")) {
            fetch(`${API_CARTELERAS}/${idSlot}/liberar`, { method: 'POST' }).then(() => cargarMapa());
        }
    }
</script>
</body>
</html>
